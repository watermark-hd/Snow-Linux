# SnowLinux のログイン画面 (LightDM GTK Greeter)
# 実際のインストールでは /etc/lightdm/lightdm-gtk-greeter.conf に入れる (scripts/install-system.sh)
[greeter]
background = /usr/share/backgrounds/SnowLinux/SnowLinux-Dusk.jpg
user-background = false
theme-name = SnowLinux
icon-theme-name = SnowLinux
font-name = Noto Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
default-user-image = snowlinux-logo-color
hide-user-image = false
# 左から: 時計、(空き)、セッション、(空き)、言語、キーボード配置、電源
indicators = ~clock;~spacer;~session;~spacer;~language;~layout;~power
clock-format = %a %H:%M
position = 50%,center 50%,center
