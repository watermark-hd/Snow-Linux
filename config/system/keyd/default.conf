# SnowLinux のキー割り当て (keyd)。実際のインストールで /etc/keyd/default.conf に入れる。
#
# 方針 (2026-11-02 決定):
#  - x86_64 版: ⌘ を Ctrl として使う。Windows のキーボードでは、Ctrl を ⌘ の代わりにするのがいちばん自然で、
#                アプリ側が Ctrl+C / V / X / Z / A / S / Q / W に対応しているので、何も割り当てない。
#  - PPC 版  : Mac のキーボードの ⌘ をそのまま ⌘ として使う。⌘ を Ctrl として送る (下の「PPC 版」を有効にする)。
#
# このファイルは、x86_64 版では中身が空でよい。PPC 版のとき、次の 2 行のコメントを外す。

[ids]
*

[main]
# --- PPC 版 (Mac のキーボード): ⌘ を Ctrl として送る ---
# leftmeta = leftcontrol
# rightmeta = rightcontrol
