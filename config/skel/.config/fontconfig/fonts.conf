<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SnowLinux フォント設定
  - 漢字を日本の字形で表示する (中国向けの字形は跳ね・払いが違って読みにくい)
  - Noto CJK は JP を名指しで選ぶ。SC / TC / KR / HK は使わない
  - lang を書き換える規則は入れない (文字列で lang を追加すると GTK のアプリで全部の文字が □ になった)
-->
<fontconfig>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
      <family>BIZ UDPGothic</family>
      <family>VL PGothic</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
      <family>IPAexMincho</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>BIZ UDGothic</family>
    </prefer>
  </alias>

  <!-- 中国向けの字形のフォントは、ほかに字がないときだけ使う -->
  <match target="pattern">
    <test name="family"><string>Droid Sans Fallback</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>WenQuanYi Micro Hei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>

</fontconfig>
